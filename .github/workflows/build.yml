name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-format:
    name: Code Formatting Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify Formatting
        run: cargo fmt --all --check

  build-host:
    name: Build Host Utilities
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Host Tools
        working-directory: host
        run: cargo build --release --target x86_64-pc-windows-msvc

  build-uefi:
    name: Build UEFI Loader
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-uefi
          components: rust-src

      - name: Install LLVM & Clang
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev

      - name: Build UEFI Application
        run: cargo build --release --target x86_64-unknown-uefi
